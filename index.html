<body>

    <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">TIMEPUCP – Temporizador de exámenes online para aulas</h1>

    <header>
        <div class="config">
            <div class="hora-input">
                <label for="horaInicio">Inicio:</label>
                <div class="time-wrapper">
                    <input type="time" id="horaInicio" aria-label="Hora de inicio del examen">
                </div>
            </div>

            <div class="hora-input">
                <label for="horaFin">Fin:</label>
                <div class="time-wrapper">
                    <input type="time" id="horaFin" aria-label="Hora de fin del examen">
                </div>
            </div>

            <div class="tiempo-restante">
                <span class="label-restante">Tiempo restante</span>
                <span id="contador" role="timer" aria-live="polite">00:00:00</span>
            </div>
        </div>
    </header>

    <main>
        <div class="hora-actual">
            <span id="horaActual" role="timer" aria-live="off">12:34:35 PM</span>
        </div>

        <div class="barra-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="barra-progreso" id="barraProgreso"></div>
            <span class="barra-porcentaje" id="barraPorcentaje">0%</span>
        </div>

        <!-- Contador solo visible en modo solo reloj -->
        <div class="contador-solo-reloj">
            <span id="contadorSolo" role="timer">00:00:00</span>
        </div>

        <div class="info">
            <div class="tarjetas">
                <!-- Tarjeta izquierda: datos del curso -->
                <section class="tarjeta tarjeta-izq" aria-label="Datos del curso">
                    <div class="campo campo-curso">
                        <label for="curso"><span class="lbl-txt">Curso:</span></label>
                        <input type="text" placeholder="Curso" id="curso">
                    </div>

                    <div class="campo campo-evaluacion">
                        <label for="evaluacion"><span class="lbl-txt">Evaluación:</span></label>
                        <input type="text" placeholder="Evaluación" id="evaluacion">
                    </div>

                    <div class="campo campo-clave">
                        <label for="claveCurso"><span class="lbl-txt">Clave del curso:</span></label>
                        <input type="text" placeholder="EST123" id="claveCurso">
                    </div>
                </section>

                <!-- Tarjeta derecha: profesor, fecha y lugar -->
                <section class="tarjeta tarjeta-der" aria-label="Datos de la sesión">
                    <div class="campo campo-profesor">
                        <label for="profesor"><span class="lbl-txt">Profesor:</span></label>
                        <input type="text" placeholder="C. Q." id="profesor">
                    </div>

                    <div class="campo campo-fecha">
                        <label for="fechaTexto"><span class="lbl-txt">Fecha:</span></label>
                        <input type="text" id="fechaTexto" placeholder="dd/mm/yyyy" readonly aria-label="Fecha del examen">
                        <input type="date" id="fecha" style="position:absolute; opacity:0; pointer-events:none;"
                            aria-hidden="true">
                    </div>

                    <div class="campo-doble">
                        <div class="campo campo-horario">
                            <label for="aula"><span class="lbl-txt">Horario:</span></label>
                            <input type="text" placeholder="0123" id="aula">
                        </div>

                        <div class="campo campo-aula">
                            <label for="aulaSalon"><span class="lbl-txt">Aula:</span></label>
                            <input type="text" placeholder="Z123" id="aulaSalon">
                        </div>
                    </div>
                </section>
            </div>

            <!-- Fila 4: Botones -->
            <div class="fila fila-acciones">
                <div class="acciones">
                    <button id="btnFullscreen" class="btn-action" aria-label="Activar pantalla completa">
                        <span class="icon">⛶</span>
                        <span class="text">Pantalla completa</span>
                    </button>
                    <button id="btnDarkMode" class="btn-action" aria-label="Cambiar a modo oscuro">
                        <span class="icon">🌙</span>
                        <span class="text">Modo oscuro</span>
                    </button>
                    <button id="btnSoloReloj" class="btn-action" aria-label="Modo solo reloj">
                        <span class="icon">🕐</span>
                        <span class="text">Solo reloj</span>
                    </button>
                    <button id="btnApuntes" class="btn-action" aria-label="Abrir panel de apuntes">
                        <span class="icon">📝</span>
                        <span class="text">Apuntes</span>
                    </button>
                    <button id="btnReset" class="btn-action btn-secondary" aria-label="Reiniciar temporizador">
                        <span class="icon">↻</span>
                        <span class="text">Reiniciar</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Panel flotante de apuntes -->
    <div id="panelApuntes" class="panel-apuntes" role="dialog" aria-label="Panel de apuntes">
        <div class="panel-apuntes-header" id="panelApuntesHeader">
            <span class="panel-apuntes-titulo">📝 Apuntes</span>
            <div class="panel-apuntes-controles">
                <button class="panel-apuntes-btn-size" id="btnApuntesFontUp" aria-label="Aumentar fuente" title="Aumentar fuente">A+</button>
                <button class="panel-apuntes-btn-size" id="btnApuntesFontDown" aria-label="Reducir fuente" title="Reducir fuente">A−</button>
                <button class="panel-apuntes-cerrar" id="btnCerrarApuntes" aria-label="Cerrar apuntes">✕</button>
            </div>
        </div>
        <textarea id="apuntesTexto" class="panel-apuntes-texto" placeholder="Escribe aquí un anuncio, corrección o apunte para los alumnos..."></textarea>
        <!-- Bordes de redimensionado -->
        <div class="pa-edge pa-edge-n" data-dir="n" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-s" data-dir="s" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-e" data-dir="e" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-w" data-dir="w" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-ne" data-dir="ne" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-nw" data-dir="nw" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-se" data-dir="se" aria-hidden="true"></div>
        <div class="pa-edge pa-edge-sw" data-dir="sw" aria-hidden="true"></div>
    </div>

    <!-- Botón flotante para salir del modo solo reloj -->
    <!-- Modal: Evaluación terminada -->
    <div id="modalFin" class="modal-fin" role="dialog" aria-modal="true" aria-label="Evaluación terminada">
        <div class="modal-fin-contenido">
            <div class="modal-fin-icono">⏱</div>
            <h2 class="modal-fin-titulo">¡Evaluación terminada!</h2>

            <button id="btnCerrarModal" class="modal-fin-btn">Cerrar</button>
        </div>
    </div>

    <button id="btnSalirSoloReloj" class="btn-salir-solo" aria-label="Salir del modo solo reloj">
        <span class="icon">✕</span>
        <span class="text">Salir</span>
    </button>

    <a class="enlace-guia" href="guia/" target="_blank" rel="noopener">Guía de uso</a>

</body>
